<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f4f1"/>
  
  <!-- Plate -->
  <ellipse cx="100" cy="160" rx="80" ry="20" fill="#e8e8e8"/>
  
  <!-- Pudim base -->
  <ellipse cx="100" cy="140" rx="60" ry="50" fill="#f4f1db"/>
  
  <!-- Pudim top -->
  <ellipse cx="100" cy="120" rx="55" ry="45" fill="#f5f5dc"/>
  
  <!-- Caramel sauce -->
  <ellipse cx="100" cy="110" rx="50" ry="40" fill="#d4a574"/>
  
  <!-- Coconut flakes -->
  <rect x="85" y="95" width="4" height="8" rx="2" fill="#ffffff" transform="rotate(30 87 99)"/>
  <rect x="95" y="100" width="4" height="8" rx="2" fill="#ffffff" transform="rotate(-30 97 104)"/>
  <rect x="105" y="95" width="4" height="8" rx="2" fill="#ffffff" transform="rotate(60 107 99)"/>
  <rect x="100" y="105" width="4" height="8" rx="2" fill="#ffffff" transform="rotate(-60 102 109)"/>
  
  <!-- Text -->
  <text x="100" y="190" text-anchor="middle" fill="#7a6641" font-size="14" font-family="Arial">Coco</text>
</svg>
