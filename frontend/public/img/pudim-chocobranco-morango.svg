<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f4f1"/>
  
  <!-- Plate -->
  <ellipse cx="100" cy="160" rx="80" ry="20" fill="#e8e8e8"/>
  
  <!-- Pudim base -->
  <ellipse cx="100" cy="140" rx="60" ry="50" fill="#f4f1db"/>
  
  <!-- Pudim top -->
  <ellipse cx="100" cy="120" rx="55" ry="45" fill="#f5f5dc"/>
  
  <!-- Strawberry sauce -->
  <ellipse cx="100" cy="110" rx="50" ry="40" fill="#ff6b6b"/>
  
  <!-- Strawberry pieces -->
  <ellipse cx="90" cy="100" rx="3" ry="2" fill="#ff4757" transform="rotate(30 90 100)"/>
  <ellipse cx="110" cy="105" rx="3" ry="2" fill="#ff4757" transform="rotate(-30 110 105)"/>
  <ellipse cx="100" cy="95" rx="3" ry="2" fill="#ff4757" transform="rotate(60 100 95)"/>
  
  <!-- Text -->
  <text x="100" y="190" text-anchor="middle" fill="#7a6641" font-size="10" font-family="Arial">Choco Branco + Morango</text>
</svg>
