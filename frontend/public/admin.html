<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Painel de Pedidos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="papudimlogo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Quicksand", sans-serif;
        background-color: #fdfaf6;
      }
      @media (max-width: 640px) {
        .admin-title {
          font-size: 1.25rem;
        }
      }

      button,
      .btn,
      a,
      .rounded-xl,
      .rounded-lg {
        transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      button:active,
      .btn:active,
      a:active {
        transform: scale(0.97);
        box-shadow: 0 2px 8px #0001;
      }
      button:focus-visible,
      .btn:focus-visible,
      a:focus-visible {
        outline: 2px solid #a47551;
        outline-offset: 2px;
      }
      .page-fade {
        opacity: 0;
        animation: pageFadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body class="min-h-screen px-2 py-4 sm:px-4 sm:py-8 bg-[#fdfaf6] page-fade">
    <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-lg p-4 sm:p-8">
      <!-- Header -->
      <div
        class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4"
      >
        <div class="flex items-center gap-3">
          <img
            src="papudimlogo.png"
            alt="Logo"
            class="w-10 h-10 sm:w-12 sm:h-12 rounded-full shadow"
          />
          <h1
            class="admin-title text-xl sm:text-2xl font-bold text-[#a47551] tracking-tight"
          >
            Pedidos Recebidos
          </h1>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
          <button
            onclick="exportarCSV()"
            class="flex-1 sm:flex-none bg-[#a47551] hover:bg-[#916546] text-white px-3 py-2 sm:px-4 sm:py-2 rounded-xl transition flex items-center gap-2 shadow"
          >
            <span class="material-icons-outlined text-lg">download</span>
            <span class="hidden sm:inline">Exportar CSV</span>
          </button>
          <button
            id="btnInsights"
            class="flex-1 sm:flex-none bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 sm:px-4 sm:py-2 rounded-xl transition flex items-center gap-2 shadow"
            onclick="mostrarInsights()"
          >
            <span class="material-icons-outlined text-lg">insights</span>
            <span class="hidden sm:inline">Ver Insights</span>
          </button>
          <button
            onclick="logout()"
            class="flex-1 sm:flex-none bg-red-500 hover:bg-red-600 text-white px-3 py-2 sm:px-4 sm:py-2 rounded-xl transition flex items-center gap-2 shadow"
          >
            <span class="material-icons-outlined text-lg">logout</span>
            <span class="hidden sm:inline">Sair</span>
          </button>
        </div>
      </div>

      <!-- Filtro -->
      <div class="mb-4 flex flex-col sm:flex-row items-center gap-2">
        <label for="filtroStatus" class="font-semibold text-[#a47551]"
          >Filtrar por status:</label
        >
        <select
          id="filtroStatus"
          onchange="carregarPedidos()"
          class="border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#a47551] w-full sm:w-auto"
        >
          <option value="">Todos</option>
          <option value="pendente">Pendente</option>
          <option value="a fazer">A fazer</option>
          <option value="em produção">Em produção</option>
          <option value="pronto">Pronto</option>
        </select>
      </div>

      <!-- Tabela responsiva -->
      <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-sm">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-[#f3e8df] text-[#a47551]">
              <th class="py-2 px-3 text-left">Cliente</th>
              <th class="py-2 px-3 text-left">Endereço</th>
              <th class="py-2 px-3 text-left">Celular</th>
              <th class="py-2 px-3 text-left">Total</th>
              <th class="py-2 px-3 text-left">Status</th>
              <th class="py-2 px-3 text-left">Itens</th>
              <th class="py-2 px-3 text-left">Data</th>
              <th class="py-2 px-3 text-left">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaPedidos"></tbody>
        </table>
      </div>
    </div>

    <!-- Insights -->
    <div
      id="insights"
      class="max-w-4xl mx-auto mt-6 mb-8 p-6 bg-gradient-to-br from-[#f3e8df] to-[#fdfaf6] rounded-xl shadow flex flex-col gap-2 text-[#5c3b1e] hidden"
    >
      <div class="flex items-center justify-between mb-2">
        <span class="font-bold text-lg flex items-center gap-2">
          <span class="material-icons-outlined text-2xl text-blue-600"
            >insights</span
          >
          Insights do Papudim
        </span>
        <button
          id="btnFecharInsights"
          onclick="fecharInsights()"
          class="ml-4 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full p-1 transition"
          title="Fechar"
        >
          <span class="material-icons-outlined text-lg">close</span>
        </button>
      </div>
      <div id="insights-content" class="text-base"></div>
    </div>

    <footer class="mt-10 text-sm text-gray-500 text-center">
      &copy; 2025 Papudim
    </footer>

    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined"
      rel="stylesheet"
    />
    <script src="ux.js"></script>

    <script>
      const API_URL = "https://homepudimback.onrender.com/api";
      
      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Verificação de autenticação via cookie HttpOnly
      // O cookie não é acessível via JS; validamos chamando uma rota protegida
      let todosPedidos = [];
      let paginaAtual = 1;
      let totalPaginas = 1;

      async function verificarAuth() {
        try {
          const res = await fetch(`${API_URL}/verificar-auth`, { 
            credentials: "include" 
          });
          
          if (res.status === 401 || res.status === 403) {
            window.location.href = "/admin-login.html";
            return false;
          }
          return true;
        } catch (err) {
          window.location.href = "/admin-login.html";
          return false;
        }
      }

      // Executar verificação inicial
      verificarAuth().then((ok) => {
        if (ok) carregarPedidos();
      });

      async function carregarPedidos(pagina = 1) {
        const tabela = document.getElementById("tabelaPedidos");
        const filtro = document.getElementById("filtroStatus").value;
        
        // Mostrar loader na tabela
        tabela.innerHTML = `
          <tr>
            <td colspan="8" class="py-8 text-center">
              <div class="flex flex-col items-center gap-2">
                <svg class="animate-spin w-8 h-8 text-[#a47551]" viewBox="0 0 50 50">
                  <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="90, 150"></circle>
                </svg>
                <span class="text-gray-500">Carregando pedidos...</span>
              </div>
            </td>
          </tr>
        `;

        try {
          const params = new URLSearchParams({
            pagina: pagina,
            limite: 20,
            ordenarPor: 'criadoEm',
            ordem: 'desc'
          });
          
          if (filtro) {
            params.append('status', filtro);
          }

          const res = await fetch(`${API_URL}/admin-pedidos?${params}`, {
            credentials: "include",
          });

          if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
              UX.error("Sessão expirada. Redirecionando...");
              setTimeout(() => {
                window.location.href = "/admin-login.html";
              }, 1500);
              return;
            }
            throw new Error(`Erro ${res.status}`);
          }

          const data = await res.json();
          
          // Suporte para resposta com paginação ou array simples
          if (Array.isArray(data)) {
            todosPedidos = data;
            paginaAtual = 1;
            totalPaginas = 1;
          } else {
            todosPedidos = data.pedidos || [];
            paginaAtual = data.paginacao?.paginaAtual || 1;
            totalPaginas = data.paginacao?.totalPaginas || 1;
          }

          renderizarPedidos();
          
        } catch (error) {
          console.error("Erro ao carregar pedidos:", error);
          
          const isOffline = !navigator.onLine;
          
          tabela.innerHTML = `
            <tr>
              <td colspan="8" class="py-8 text-center">
                <div class="flex flex-col items-center gap-3">
                  <div class="w-12 h-12 text-red-400">
                    <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
                    </svg>
                  </div>
                  <p class="text-red-500 font-medium">
                    ${isOffline ? 'Sem conexão com a internet' : 'Erro ao carregar pedidos'}
                  </p>
                  <button 
                    onclick="carregarPedidos(${pagina})" 
                    class="px-4 py-2 bg-[#a47551] hover:bg-[#916546] text-white rounded-lg transition flex items-center gap-2"
                  >
                    <span class="material-icons-outlined text-sm">refresh</span>
                    Tentar novamente
                  </button>
                </div>
              </td>
            </tr>
          `;
          
          UX.error(isOffline ? 'Sem conexão com a internet' : 'Erro ao carregar pedidos');
        }
      }

      function renderizarPedidos() {
        const tabela = document.getElementById("tabelaPedidos");
        const filtro = document.getElementById("filtroStatus").value;

        let filtrados = filtro
          ? todosPedidos.filter((p) => p.status === filtro)
          : todosPedidos;

        if (!filtro) {
          filtrados = filtrados.filter((p) => p.status !== "pronto");
        }

        filtrados.sort((a, b) => {
          const ta = Number(a.id?.split("-")[1]) || 0;
          const tb = Number(b.id?.split("-")[1]) || 0;
          return tb - ta;
        });

        tabela.innerHTML = "";

        if (filtrados.length === 0) {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td colspan="8" class="py-8 text-center text-gray-400">
              <div class="flex flex-col items-center gap-2">
                <span class="material-icons-outlined text-4xl opacity-30">inbox</span>
                <span>Nenhum pedido encontrado.</span>
              </div>
            </td>
          `;
          tabela.appendChild(linha);
        } else {
          filtrados.forEach((pedido) => {
            const linha = document.createElement("tr");
            const data = new Date(
              Number(pedido.id?.split("-")[1]) || 0
            ).toLocaleString("pt-BR");
            const itens = pedido.itens
              .map((i) => `${i.nome} x${i.quantidade}`)
              .join(", ");

            let corLinha = "";
            if (pedido.status === "a fazer") corLinha = "bg-red-100";
            else if (pedido.status === "em produção")
              corLinha = "bg-yellow-100";
            else if (pedido.status === "pronto") corLinha = "bg-green-100";
            else if (pedido.status === "pendente") corLinha = "bg-gray-100";
            else corLinha = "bg-red-200";

            linha.className = `hover:bg-[#f3e8df] transition ${corLinha}`;
            linha.innerHTML = `
              <td class="py-2 px-3">${escapeHTML(pedido.cliente)}</td>
              <td class="py-2 px-3">${escapeHTML(pedido.endereco || "-")}</td>
              <td class="py-2 px-3">${escapeHTML(pedido.celular || "-")}</td>
              <td class="py-2 px-3">R$ ${pedido.total.toFixed(2)}</td>
              <td class="py-2 px-3">
                <select onchange="alterarStatusPedido('${
                  pedido.id
                }', this.value)" class="border rounded px-2 py-1 text-xs">
                  <option value="a fazer" ${
                    pedido.status === "a fazer" ? "selected" : ""
                  }>A fazer</option>
                  <option value="em produção" ${
                    pedido.status === "em produção" ? "selected" : ""
                  }>Em produção</option>
                  <option value="pronto" ${
                    pedido.status === "pronto" ? "selected" : ""
                  }>Pronto</option>
                  <option value="pendente" ${
                    pedido.status === "pendente" ? "selected" : ""
                  }>Pendente</option>
                </select>
              </td>
              <td class="py-2 px-3">${escapeHTML(itens)}</td>
              <td class="py-2 px-3">${escapeHTML(data)}</td>
              <td class="py-2 px-3">
                <button onclick="copiarMensagemPedido('${pedido.cliente}', '${
              pedido.celular
            }')"
                  class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs ml-2">
                  Enviar WhatsApp
                </button>
                <button onclick="excluirPedido('${pedido.id}')"
                  class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs ml-2">
                  Excluir
                </button>
              </td>
            `;
            tabela.appendChild(linha);
          });
        }
      }

      async function alterarStatusPedido(id, novoStatus) {
        try {
          UX.showLoader("Atualizando status...");
          
          const res = await fetch(`${API_URL}/atualizar-status`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ id, status: novoStatus }),
          });

          if (res.ok) {
            UX.success("Status atualizado!");
            carregarPedidos(paginaAtual);
          } else {
            const erro = await res.json().catch(() => ({}));
            UX.error(erro.erro || "Erro ao atualizar status");
            carregarPedidos(paginaAtual);
          }
        } catch (e) {
          UX.error("Erro de conexão ao atualizar status");
          carregarPedidos(paginaAtual);
        } finally {
          UX.hideLoader();
        }
      }

      // Função para excluir cliente/pedido
      async function excluirPedido(id) {
        const confirmado = await UX.confirm(
          "Tem certeza que deseja excluir este pedido? Esta ação não pode ser desfeita.",
          {
            title: "Excluir Pedido",
            confirmText: "Excluir",
            cancelText: "Cancelar",
            type: "danger"
          }
        );

        if (!confirmado) return;

        try {
          UX.showLoader("Excluindo pedido...");
          
          const res = await fetch(`${API_URL}/deletar-pedido/${id}`, {
            method: "DELETE",
            credentials: "include",
          });
          
          if (res.ok) {
            UX.success("Pedido excluído com sucesso!");
            carregarPedidos(paginaAtual);
          } else {
            const erro = await res.json().catch(() => ({}));
            UX.error(erro.erro || "Erro ao excluir pedido");
          }
        } catch (e) {
          UX.error("Erro de conexão ao excluir pedido");
        } finally {
          UX.hideLoader();
        }
      }

      function exportarCSV() {
        if (todosPedidos.length === 0) {
          UX.warn("Nenhum pedido para exportar");
          return;
        }

        let csv = "Cliente,Endereço,Celular,Total,Status,Itens,Data\n";
        todosPedidos.forEach((pedido) => {
          const data = new Date(
            Number(pedido.id?.split("-")[1]) || 0
          ).toLocaleString("pt-BR");
          const itens = pedido.itens
            .map((i) => `${i.nome} x${i.quantidade}`)
            .join(" / ");
          csv += `"${pedido.cliente}","${pedido.endereco || "-"}","${
            pedido.celular || "-"
          }",${pedido.total},"${pedido.status}","${itens}","${data}"\n`;
        });

        const blob = new Blob([csv], { type: "text/csv" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "pedidos_papudim.csv";
        link.click();
        
        UX.success("CSV exportado!");
      }

      async function logout() {
        try {
          UX.showLoader("Saindo...");
          await fetch(`${API_URL}/logout`, {
            method: "POST",
            credentials: "include",
          });
        } catch (e) {
          // Ignorar erro de logout
        } finally {
          UX.hideLoader();
          window.location.href = "/admin-login.html";
        }
      }

      function mostrarInsights() {
        const insightsDiv = document.getElementById("insights");
        insightsDiv.classList.remove("hidden");
        carregarInsights();
        document.getElementById("btnInsights").disabled = true;
        document
          .getElementById("btnInsights")
          .classList.add("opacity-50", "cursor-not-allowed");
      }

      function fecharInsights() {
        const insightsDiv = document.getElementById("insights");
        insightsDiv.classList.add("hidden");
        document.getElementById("btnInsights").disabled = false;
        document
          .getElementById("btnInsights")
          .classList.remove("opacity-50", "cursor-not-allowed");
      }

      async function carregarInsights() {
        const content = document.getElementById("insights-content");
        content.innerHTML = `
          <div class="flex items-center gap-2 text-gray-500">
            <svg class="animate-spin w-5 h-5" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="90, 150"></circle>
            </svg>
            Carregando insights...
          </div>
        `;

        try {
          const res = await fetch(
            "https://relatoriospudim.onrender.com/api/insights"
          );
          
          if (!res.ok) throw new Error("Erro ao carregar");
          
          const data = await res.json();
          let html = `<b>Faturamento total:</b> <span class="text-green-700">R$ ${data.faturamento_total.toFixed(
            2
          )}</span><br>`;
          html += "<b>Top Sabores:</b><ul class='list-disc pl-5'>";
          data.top_sabores.forEach(
            (s) =>
              (html += `<li>${s.sabor}: <span class="font-semibold">${s.quantidade} unidades</span></li>`)
          );
          html += "</ul>";
          html += "<b>Faturamento por data:</b><ul class='list-disc pl-5'>";
          data.timeline.forEach(
            (t) =>
              (html += `<li>${
                t.data
              }: <span class="font-semibold">R$ ${t.faturamento.toFixed(
                2
              )}</span></li>`)
          );
          html += "</ul>";
          content.innerHTML = html;
        } catch (e) {
          content.innerHTML = `
            <div class="flex items-center gap-2 text-red-500">
              <span class="material-icons-outlined">error</span>
              Erro ao carregar insights.
              <button onclick="carregarInsights()" class="underline">Tentar novamente</button>
            </div>
          `;
        }
      }

      function copiarMensagemPedido(nome, celular) {
        const mensagem = `Olá, ${nome}! 😊\n\nSeu pedido Papudim está pronto! 🍮\n\nIremos entrar em contato em breve para informar sobre a entrega.\n\nAgradecemos pela sua preferência. Qualquer dúvida, estamos à disposição!`;
        const url = `https://wa.me/55${celular}?text=${encodeURIComponent(
          mensagem
        )}`;
        window.open(url, "_blank");
      }

      // Listener para detectar mudanças de conexão
      window.addEventListener('online', () => {
        UX.success('Conexão restaurada!');
        carregarPedidos(paginaAtual);
      });

      window.addEventListener('offline', () => {
        UX.warn('Você está offline');
      });
    </script>
    <script src="script.js"></script>
  </body>
</html>
