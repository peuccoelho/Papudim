<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login Admin</title>
    <link rel="icon" href="papudimlogo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Quicksand", sans-serif;
        background-color: #fdfaf6;
      }
      @media (max-width: 640px) {
        .login-card {
          padding: 1.25rem !important;
          border-radius: 1.25rem !important;
          min-width: unset !important;
          max-width: 100% !important;
          width: 100% !important;
        }
        .login-title {
          font-size: 1.25rem !important;
        }
      }
      button,
      .btn,
      a,
      .rounded-xl,
      .rounded-lg {
        transition:
          background 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          color 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      }
      button:active,
      .btn:active,
      a:active {
        transform: scale(0.97);
        box-shadow: 0 2px 8px #0001;
      }
      button:focus-visible,
      .btn:focus-visible,
      a:focus-visible {
        outline: 2px solid #a47551;
        outline-offset: 2px;
      }

      .page-fade {
        opacity: 0;
        animation: pageFadeIn 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-center min-h-screen px-2 sm:px-4 page-fade"
  >
    <div
      class="login-card bg-white p-6 sm:p-8 rounded-2xl shadow-md text-center max-w-sm w-full mx-auto"
    >
      <img
        src="papudimlogo.png"
        alt="Logo"
        class="w-14 h-14 sm:w-16 sm:h-16 mx-auto mb-4 rounded-full shadow"
      />
      <h1 class="login-title text-xl sm:text-2xl font-bold text-[#a47551] mb-6">
        Login do Administrador
      </h1>
      <input
        type="password"
        id="senha"
        placeholder="Digite a senha"
        class="w-full border border-gray-300 rounded px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-[#a47551] transition text-base"
      />
      <button
        onclick="logar()"
        class="w-full bg-[#a47551] hover:bg-[#916546] text-white px-6 py-2 rounded-xl font-semibold transition text-base"
      >
        Entrar
      </button>
    </div>
    <footer class="mt-10 text-sm text-gray-500 text-center">
      &copy; 2026 Papudim
    </footer>
    <script src="ux.js"></script>
    <script>
      const API_URL = "https://homepudimback.onrender.com/api";

      async function logar() {
        const senhaInput = document.getElementById("senha");
        const senha = senhaInput.value.trim();
        const btnEntrar = document.querySelector("button");

        if (!senha) {
          UX.warn("Digite a senha");
          senhaInput.focus();
          return;
        }

        try {
          btnEntrar.disabled = true;
          UX.showLoader("Entrando...");

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 15000);

          const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ senha }),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          if (res.ok) {
            UX.success("Login realizado!");
            // Cookie HttpOnly foi setado pelo servidor
            setTimeout(() => {
              window.location.href = "/admin.html";
            }, 500);
          } else {
            const data = await res
              .json()
              .catch(() => ({ erro: "Erro desconhecido" }));

            if (res.status === 429) {
              UX.error("Muitas tentativas. Aguarde alguns minutos.");
            } else if (res.status === 401) {
              UX.error("Senha incorreta");
              senhaInput.value = "";
              senhaInput.focus();
            } else {
              UX.error(data.erro || "Falha ao logar");
            }
          }
        } catch (err) {
          console.error("Erro de login:", err);

          if (err.name === "AbortError") {
            UX.error("Tempo de conexão esgotado. Tente novamente.");
          } else if (!navigator.onLine) {
            UX.error("Sem conexão com a internet.");
          } else {
            UX.error("Erro de conexão. Tente novamente.");
          }
        } finally {
          btnEntrar.disabled = false;
          UX.hideLoader();
        }
      }

      // Permitir login com Enter
      document.addEventListener("DOMContentLoaded", () => {
        const senhaInput = document.getElementById("senha");
        senhaInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") logar();
        });
        senhaInput.focus();
      });

      // Listener para detectar mudanças de conexão
      window.addEventListener("online", () => {
        UX.success("Conexão restaurada!");
      });

      window.addEventListener("offline", () => {
        UX.warn("Você está offline");
      });
    </script>
  </body>
</html>
